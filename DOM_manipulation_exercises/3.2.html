<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Таблица умножения</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; width: 45px; height: 35px; text-align: center; }
    th { background: #eee; }
    td:hover { background: #ffd54f; }
  </style>
</head>
<body>
  <h2>Таблица умножения</h2>
  <table id="mult"></table>

  <script>
    let html = '<tr><th>×</th>';
    for (let j = 1; j <= 10; j++) html += `<th>${j}</th>`;
    html += '</tr>';

    for (let i = 1; i <= 10; i++) {
      html += `<tr><th>${i}</th>`;
      for (let j = 1; j <= 10; j++) html += `<td>${i * j}</td>`;
      html += '</tr>';
    }

    document.getElementById('mult').innerHTML = html;
  </script>
</body>
</html>
